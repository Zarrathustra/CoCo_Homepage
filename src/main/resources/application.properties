spring.application.name=coco-homepage
server.forward-headers-strategy=framework

coco.download.directory=${COCO_DOWNLOAD_DIR:./downloads}
coco.metrics.database=${COCO_METRICS_DB:./data/coco-metrics.db}
coco.metrics.time-zone=${COCO_METRICS_TIME_ZONE:Asia/Shanghai}
coco.metrics.admin-token=${COCO_METRICS_ADMIN_TOKEN:}
coco.metrics.download-dedupe-window=30s
coco.metrics.download-dedupe-retention=24h
coco.metrics.view-dedupe-retention=48h
coco.metrics.cleanup-interval=1h
coco.metrics.public-cache-duration=60s

coco.releases[0].version=v0.2.0
coco.releases[0].file-name=coco-0.2.6.tar.gz
